plugins {
	id "se.bjurr.gradle.bundle-jar" version "2.3.0"
}

javaExtension {
	javaVersion = 17
}

dependencies {
	compileOnly "org.springframework:spring-web:7.0.9"
	implementation "org.slf4j:slf4j-api:2.0.19"

	testImplementation "org.springframework:spring-web:7.0.9"
	testImplementation "org.junit.jupiter:junit-jupiter:6.1.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.1.3"
	testImplementation "org.assertj:assertj-core:2.9.1"
	testImplementation "org.mockito:mockito-all:1.10.19"
	testImplementation "com.approvaltests:approvaltests:31.0.0"
	testImplementation "org.wiremock:wiremock:3.13.2"
	testImplementation "tools.jackson.core:jackson-databind:3.2.2"
	testImplementation "org.slf4j:slf4j-simple:2.0.19"
}
