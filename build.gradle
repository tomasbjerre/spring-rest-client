plugins {
	id "se.bjurr.gradle.bundle-jar" version "2.3.0"
}

javaExtension {
	javaVersion = 17
}

def springVersion = "4.3.30.RELEASE"
dependencies {
	compileOnly "org.springframework:spring-web:${springVersion}"
	implementation "org.slf4j:slf4j-api:2.0.16"

	testImplementation "org.springframework:spring-web:${springVersion}"
	testImplementation "org.junit.jupiter:junit-jupiter:6.1.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.1.3"
	testImplementation "org.assertj:assertj-core:2.3.0"
	testImplementation "org.mockito:mockito-all:1.8.5"
	testImplementation "com.approvaltests:approvaltests:12.1.1"
	testImplementation "org.wiremock:wiremock:3.13.2"
	// Spring 4.3.30's MappingJackson2HttpMessageConverter (used in tests) hard-requires
	// Jackson 2 on the classpath; Spring only gained Jackson 3 support in Spring 7.
	testImplementation "com.fasterxml.jackson.core:jackson-databind:2.13.0"
	// Used directly by WiremockInvocation for approval-test snapshot serialization.
	testImplementation "tools.jackson.core:jackson-databind:3.2.2"
	testImplementation "org.slf4j:slf4j-simple:2.0.16"
}
